name: My First Action!
on: 
    push:
        branches: ["main", "test"]
    pull_request:
        branches: ["main", "test"]
jobs: 
    my_first_job:
        runs-on: ubuntu-latest
        steps: 
            - name: Say Hello World
              run: echo "Hello World!"
            - name: Checkout
              uses: actions/checkout@v7
            - name: Tree
              run: tree
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
            - name: Clippy
              run: cargo clippy
            - name: Check it!
              run: cargo test
            - name: Run it!
              run: cargo run
        