name: Rust Project CI
run-name: ${{github.repository_id}} CI
on: 
    push:
        branches: ["main"]

jobs: 
    ci:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7
          - name: Install Rust
            uses: dtolnay/rust-toolchain@stable
          - name: Cargo Clippy
            run: cargo clippy
          - name: Run Test
            run: cargo test --release
          - name: Run Code
            run: cargo run
    